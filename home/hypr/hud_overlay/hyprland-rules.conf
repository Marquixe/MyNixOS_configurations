# ── HUD overlay — add these to hyprland.conf ─────────────────────────────────
# Two windows: fullscreen animation + transparent info bar at the bottom

# Animation window — fullscreen, opaque
windowrule = match:class hud-anim-kitty, float on
windowrule = match:class hud-anim-kitty, size 1920 1080
windowrule = match:class hud-anim-kitty, center on
windowrule = match:class hud-anim-kitty, opacity 0.95 0.95
windowrule = match:class hud-anim-kitty, workspace special:hud-overlay silent

# Info bar — short strip at bottom, transparent so animation shows through
windowrule = match:class hud-info-kitty, float on
windowrule = match:class hud-info-kitty, size 1920 260
windowrule = match:class hud-info-kitty, move 0 820
windowrule = match:class hud-info-kitty, opacity 0.30 0.30
windowrule = match:class hud-info-kitty, workspace special:hud-overlay silent
windowrule = match:class hud-info-kitty, pin on

# Toggle both with one key
# bind = $mainMod, H, togglespecialworkspace, hud-overlay
# bind = $mainMod SHIFT, H, exec, bash ~/.config/hypr/hud_overlay/hud.sh
